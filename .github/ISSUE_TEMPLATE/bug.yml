name: Bug report / 问题反馈
description: Report a reproducible AI Switch problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿提交 Token、API Key、邮箱、完整日志或备份。Never include credentials or private account data."
  - type: input
    id: version
    attributes:
      label: AI Switch version / 版本
      placeholder: v1.13.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 系统
      options: [Windows 10, Windows 11, macOS Apple Silicon, macOS Intel]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result / 预期与实际结果
    validations:
      required: true
